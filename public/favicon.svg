<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="경북 CoCo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0FA3A3"/>
      <stop offset="0.55" stop-color="#008080"/>
      <stop offset="1" stop-color="#00595A"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#gloss)"/>

  <!-- 코스(course) 를 뜻하는 C 형 경로 -->
  <path d="M 338.3 157.9 A 128 128 0 1 0 338.3 354.1"
        fill="none" stroke="#FFFFFF" stroke-width="54" stroke-linecap="round"/>

  <!-- 출발점 -->
  <circle cx="338.3" cy="157.9" r="13" fill="#008080"/>

  <!-- 도착 마커 -->
  <circle cx="338.3" cy="354.1" r="49" fill="#00595A" opacity="0.35"/>
  <circle cx="338.3" cy="354.1" r="42" fill="#FEE500"/>
  <circle cx="338.3" cy="354.1" r="15" fill="#00595A"/>
</svg>
